        /* ============== HEADER ============== */

<body>

    <!-- MODAL MASUK NAMA -->
    <div id="modalNama" class="modal-nama">

            <input type="text" id="inputNama" placeholder="Ketik nama kamu..." maxlength="20">
            <button onclick="simpanNama()">MASUK CHAT</button>

    </div>

    <!-- ALERT KUSTOM -->
    <div id="alertBox" class="overlay-alert hidden">

            <button onclick="tutupAlert()">OK</button>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div id="kontenUtama" class="hidden">
        <div class="header-wrapper">
            <div class="header">
                <div class="header-top">
                    <div class="header-left">
                        <button class="btn-icon" onclick="scrollKeBawah()" title="Scroll ke bawah">
                            <i class="fa-solid fa-comment"></i>
                        </button>
                        <h1 class="judul-chat"> PUBLIC CHAT</h1>
                    </div>
                    <div class="header-right">
                        <div class="status-indikator">
                            <span id="dotServer" class="dot offline"></span>
                            <span id="teksServer">Offline</span>

                        </button>
                    </div>
                </div>
                <div class="info-bar">
                    <span id="totalPesan">💬 Total Chat: 0</span>

        <div id="daftarChat" class="chat-container"></div>

            <input type="text" id="inputPesan" placeholder="Ketik pesan kamu..." maxlength="500" on-keypress="cekEnter(event)">
            <button class="btn-kirim" onclick="kirimPesan()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

<script>
// ==============================================
// KONFIGURASI — GANTI DENGAN MILIK KAMU
const SUPABASE_URL = 'https://izsrzxlnkcjzzvxetctd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6c3J6eGxua2Nqenp2eGV0Y3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjk0ODUsImV4cCI6MjEwNzk0NTQ4NX0.YAYFkVKNOr0e6-ZxoU4uPidKGXk7vKU_xeXpfOvkrZA';
// ==============================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Variabel Global
let namaPengguna = localStorage.getItem('namaPengguna') || null;
let deviceId = localStorage.getItem('deviceId') || null;
let lastDateChecked = null;
let totalPesanSaatIni = 0;
let scrollOtomatis = true;

// Inisialisasi Device ID
if (!deviceId) {
    deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    localStorage.setItem('deviceId', deviceId);
}

// ============== ALERT KUSTOM ==============
function tampilkanAlert(teks, judul='Pesan') {
    document.getElementById('alertJudul').textContent = judul;
    document.getElementById('alertTeks').textContent = teks;
    document.getElementById('alertBox').classList.remove('hidden');
}

function tutupAlert() {
    document.getElementById('alertBox').classList.add('hidden');
}

// ============== FORMAT WAKTU & TANGGAL ==============
function dapatkanZonaWaktu() {
    const offset = new Date().getTimezoneOffset();
    if (offset === -480) return 'WITA'; // UTC+8
    if (offset === -420) return 'WIB';  // UTC+7
    if (offset === -540) return 'WIT';  // UTC+9
    return '';
}

function formatWaktu(tanggal) {
    const t = new Date(tanggal);
    const jam = String (t.getHours()).padStart(2, '0');
    const menit = String(t.getMinutes()).padStart(2, '0');
    const zona = dapatkanZonaWaktu();
    return `${jam}:${menit} ${zona}`;
}

function formatTanggal(tanggal) {
    const t = new Date(tanggal);
    const hari = String(t.getDate()).padStart(2, '0');
    const bulan = String(t.getMonth() + 1).padStart(2, '0');
    const tahun = t.getFullYear();
    return `${hari}/${bulan}/${tahun}`;
}

function dapatkanTanggalHariIni() {
    return formatTanggal(new Date());
}

// ============== CEK RESET HARIAN ==============
function sudahTengahMalamWITA(tanggalTerakhirReset) {
    // Dapatkan tanggal hari ini di WITA dengan cara yang pasti
    const hariIniWITA = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' });
    const jamSekarangWITA = new Date().getHours() + 8; // WITA = UTC+8
    const jamNormal = jamSekarangWITA >= 24 ? jamSekarangWITA - 24 : jamSekarangWITA;
    
    // Bersihkan tanggal dari database — ambil hanya bagian YYYY-MM-DD
    const tanggalBersih = String(tanggalTerakhirReset).split('T')[0];
    
    const hariBerbeda = hariIniWITA !== tanggalBersih;
    const sudahTengahMalam = true; // Cukup cek hari saja
    
    console.log('📅 Hari ini:', hariIniWITA, '| Terakhir reset:', tanggalBersih);
    
    return hariBerbeda && sudahTengahMalam;
}



async function resetPesanJikaPerlu() {
    try {
        // Ambil tanggal terakhir reset
        const { data, error } = await sb
            .from('chat_config')
            .select('last_reset_date')
            .eq('id', 1)
            .single();

        if (error) throw error;

        if (sudahTengahMalamWITA(data.last_reset_date)) {
            console.log('🌙 Hari berganti — mulai reset...');
            
            // Langkah 1: Hapus semua pesan
            const { error: hapusError } = await sb
                .from('pesan')
                .delete()
                .neq('id', 0); // Hapus semua yang ID > 0

            if (hapusError) throw hapusError;
            console.log('🗑️ Pesan lama terhapus');
            
            // Langkah 2: PERBARUI TANGGAL HARI INI — SEBELUM KELUAR DARI FUNGSI
            const hariIniWITA = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Makassar' });
            
            const { error: updateError } = await sb
                .from('chat_config')
                .update({ last_reset_date: hariIniWITA })
                .eq('id', 1);

            if (updateError) throw updateError;
            
            console.log('✅ Reset selesai! Tanggal diperbarui ke:', hariIniWITA);
        }
    } catch (e) {
        console.log('⚠️ Reset error:', e.message);
    }
}




// ============== SIMPAN NAMA ==============
function simpanNama() {
    const input = document.getElementById('inputNama');
    const nama = input.value.trim();
    
    if (!nama) {
        tampilkanAlert('Silakan masukkan nama terlebih dahulu!', 'Peringatan');
        return;
    }
    
    namaPengguna = nama;
    localStorage.setItem('namaPengguna', namaPengguna);
    document.getElementById('modalNama').classList.add('hidden');
    document.getElementById('kontenUtama').classList.remove('hidden');
    
    initChat();
}

// ============== UPDATE STATUS ONLINE ==============
async function perbaruiStatusOnline() {
    try {
        const { data, error } = await sb
            .from('user_online')
            .upsert(
                { 
                    nama: namaPengguna, 
                    device_id: deviceId,
                    last_seen: new Date().toISOString()
                },
                { onConflict: 'device_id' }
            );
        
        if (error) throw error;
        document.getElementById('dotServer').classList.add('online');
        document.getElementById('dotServer').classList.remove('offline');
        document.getElementById('teksServer').textContent = 'Online';
    } catch (e) {
        console.log('Status online error:', e.message);
        document.getElementById('dotServer').classList.remove('online');
        document.getElementById('dotServer').classList.add('offline');
        document.getElementById('teksServer').textContent = 'Offline';
    }
}

async function bersihkanUserOffline() {
    const batasWaktu = new Date(Date.now() - 60 * 1000).toISOString(); // 1 menit
    try {
        await sb
            .from('user_online')
            .delete()
            .lt('last_seen', batasWaktu);
    } catch (e) {
        console.log('Bersihkan offline error:', e.message);
    }
}

async function hitungUserOnline() {
    try {
        await bersihkanUserOffline();
        const { count, error } = await sb
            .from('user_online')
            .select('*', { count: 'exact', head: true });
        
        if (error) throw error;
        document.getElementById('jumlahOnline').innerHTML = `<i class="fa-solid fa-circle"></i> Online: ${count || 0}`;
    } catch (e) {
        console.log('Hitung online error:', e.message);
    }
}

// ============== MUAT & TAMPILKAN PESAN ==============
async function muatPesan() {
    try {
        const { data, error } = await sb
            .from('pesan')
            .select('*')
            .order('waktu', { ascending: true });
        
        if (error) throw error;
        
        const daftarChat = document.getElementById('daftarChat');
        const posisiSebelum = daftarChat.scrollHeight - daftarChat.scrollTop;
        
        daftarChat.innerHTML = '';
        
        // Pesan Selamat Datang dari Sistem
        tambahPesanSistem(`Welcome ${namaPengguna}! To Global Chat.`);
        
        // Tampilkan pesan-pesan
        if (data && data.length > 0) {
            data.forEach(pesan => tambahPesanUI(pesan));
        }
        
        totalPesanSaatIni = data ? data.length : 0;
        document.getElementById('totalPesan').innerHTML = `<i class="fa-solid fa-message"></i> Total Chat: ${totalPesanSaatIni}`;
        
        // Scroll ke bawah otomatis
        if (scrollOtomatis) {
            scrollKeBawah();
        } else {
            daftarChat.scrollTop = daftarChat.scrollHeight - posisiSebelum;
        }
    } catch (e) {
        console.log('Muat pesan error:', e.message);
    }
}

function tambahPesanUI(pesan) {
    const daftarChat = document.getElementById('daftarChat');
    const elemen = document.createElement('div');
    
    const adalahSaya = pesan.nama === namaPengguna;
    const isAdmin = pesan.nama === 'Yobel'; // Ganti dengan nama admin yang kamu mau
    
    elemen.className = `pesan-wrapper pesan-umum ${adalahSaya ? 'pesan-saya' : ''}`;
    
    const badgeAdmin = isAdmin ? `<span class="badge-admin">ADMIN</span>` : '';
    
    elemen.innerHTML = `
        <div class="info-pengirim">
            ${!adalahSaya ? `<span class="nama-pengirim">${escapeHtml(pesan.nama)}${badgeAdmin}</span>` : ''}
            <span class="waktu-pesan">${formatWaktu(pesan.waktu)}</span>
            ${adalahSaya ? `<span class="nama-pengirim">${escapeHtml(pesan.nama)}${badgeAdmin}</span>` : ''}
        </div>
        <div class="kotak-pesan">
            <div class="isi-pesan">${escapeHtml(pesan.pesan)}</div>
        </div>
    `;
    daftarChat.appendChild(elemen);
}



function tambahPesanSistem(teks) {
    const daftarChat = document.getElementById('daftarChat');
    const elemen = document.createElement('div');
    elemen.className = 'pesan-wrapper pesan-sistem';
    elemen.innerHTML = `
        <div class="kotak-pesan" style="background: #facc15;">
            <div class="nama-pengirim"><i class="fa-solid fa-gear"></i> SISTEM</div>
            <div class="isi-pesan">${escapeHtml(teks)}</div>
        </div>
    `;
    daftarChat.appendChild(elemen);
}

function escapeHtml(teks) {
    const div = document.createElement('div');
    div.textContent = teks;
    return div.innerHTML;
}

// ============== KIRIM PESAN ==============
async function kirimPesan() {
    const input = document.getElementById('inputPesan');
    const teks = input.value.trim();
    
    if (!teks) return;
    
    try {
        // Sisipkan pesan — Supabase akan otomatis buat ID unik
        const { error } = await sb
            .from('pesan')
            .insert({
                nama: namaPengguna,
                pesan: teks
                // ❌ JANGAN kirim id — biarkan Supabase yang buat otomatis
                // ❌ JANGAN kirim user_id — kolom ini sudah dihapus
            });
        
        if (error) throw error;
        input.value = '';
        scrollOtomatis = true;
        setTimeout(() => muatPesan(), 300);
    } catch (e) {
        tampilkanAlert('Gagal mengirim pesan: ' + e.message, 'Error');
    }
}



// ============== REFRESH & SCROLL ==============
function refreshChat() {
    muatPesan();
    tampilkanAlert('Chat diperbarui!', 'Info');
}

function scrollKeBawah() {
    const daftarChat = document.getElementById('daftarChat');
    daftarChat.scrollTop = daftarChat.scrollHeight;
}

// Deteksi scroll manual
function cekScrollManual() {
    const daftarChat = document.getElementById('daftarChat');
    const jarakKeBawah = daftarChat.scrollHeight - daftarChat.scrollTop - daftarChat.clientHeight;
    scrollOtomatis = jarakKeBawah < 50;
}

// ============== EVENT ENTER ==============
function cekEnter(event) {
    if (event.key === 'Enter') {
        kirimPesan();
    }
}

// ============== INISIALISASI ==============
async function initChat() {
    document.getElementById('tanggalHariIni').innerHTML = `<i class="fa-solid fa-calendar"></i> ${dapatkanTanggalHariIni()}`;
    
    // ✅ CEK DULU — sebelum muat pesan
    await resetPesanJikaPerlu();
    
    // Baru muat pesan
    await perbaruiStatusOnline();
    await muatPesan();
    await hitungUserOnline();

    
    // ... sisa kode kamu tetap sama
    document.getElementById('daftarChat').addEventListener('scroll', cekScrollManual);
    
    setInterval(async () => {
        await muatPesan();
        await perbaruiStatusOnline();
        await hitungUserOnline();
    }, 4000);
    
    setInterval(perbaruiStatusOnline, 30000);
    setInterval(bersihkanUserOffline, 60000);
    
    window.addEventListener('blur', async () => {
        try {
            await sb.from('user_online').delete().eq('device_id', deviceId);
        } catch (e) {}
    });
    
    window.addEventListener('focus', perbaruiStatusOnline);
}

document.addEventListener('DOMContentLoaded', () => {
    if (namaPengguna) {
        document.getElementById('modalNama').classList.add('hidden');
        document.getElementById('kontenUtama').classList.remove('hidden');
        initChat();
    }
});
