<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>
        <!-- Script Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face {
            font-family: 'Robot Reavers';
            src: url('Robot-Reavers.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Robot Reavers', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --biru: #3B82D4;
            --kuning: #FCD300;
            --hitam: #000000;
            --putih: #FFFFFF;
        }

        body {
            background: #F8F5EB;
            background-image: radial-gradient(#D4CDB8 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============= LAYAR NAMA ============= */
        #nameScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8F5EB;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        #nameScreen.hidden {
            display: none !important;
        }

        .name-card {
            background: var(--putih);
            border: 4px solid var(--hitam);
            box-shadow: 6px 6px 0 var(--hitam);
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .name-card h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .name-card p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #444;
        }

        .name-card input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 3px solid var(--hitam);
            outline: none;
            margin-bottom: 20px;
            background: var(--putih);
        }

        .btn-yellow {
            background: var(--kuning);
            border: 3px solid var(--hitam);
            box-shadow: 4px 4px 0 var(--hitam);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-yellow:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--hitam);
        }

        /* ============= HEADER ============= */
        #chatPage {
            display: none;
            padding-bottom: 90px;
        }

        #chatPage.show {
            display: block;
        }

        .header {
            background: var(--putih);
            border-bottom: 4px solid var(--hitam);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .refresh-btn {
            width: 40px;
            height: 40px;
            background: var(--kuning);
            border: 3px solid var(--hitam);
            box-shadow: 3px 3px 0 var(--hitam);
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            align-items: center;
        }

        .status-online { color: #22C55E; font-weight: bold; }
        .status-offline { color: #EF4444; font-weight: bold; }

        /* ============= CHAT AREA ============= */
        .chat-container {
            padding: 16px;
        }

        #chatBox {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Pesan Sistem — Selalu di atas */
        .msg-system {
            order: -1;
            background: var(--biru);
            color: var(--putih);
            border: 3px solid var(--hitam);
            box-shadow: 4px 4px 0 var(--hitam);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .msg-system .sender {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-wrapper.own {
            align-self: flex-end;
        }

        .msg-wrapper.other {
            align-self: flex-start;
        }

        .msg-header {
            font-size: 11px;
            color: #555;
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
        }

        .msg-bubble {
            background: var(--putih);
            border: 3px solid var(--hitam);
            box-shadow: 4px 4px 0 var(--hitam);
            padding: 10px 14px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .msg-wrapper.own .msg-bubble {
            background: var(--kuning);
        }

        /* ============= INPUT BAWAH ============= */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--putih);
            border-top: 4px solid var(--hitam);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 3px solid var(--hitam);
            outline: none;
            background: var(--putih);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: var(--biru);
            color: var(--putih);
            border: 3px solid var(--hitam);
            box-shadow: 3px 3px 0 var(--hitam);
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }

        /* ============= ALERT KUSTOM ============= */
        #alertOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #alertOverlay.aktif {
            display: flex;
        }

        .alert-card {
            background: var(--putih);
            border: 4px solid var(--hitam);
            box-shadow: 6px 6px 0 var(--hitam);
            padding: 25px;
            max-width: 340px;
            width: 90%;
            text-align: center;
        }

        .alert-card h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .alert-card p {
            margin-bottom: 20px;
            font-size: 14px;
        }

        #chatBox {
    scroll-behavior: smooth;
        }
        

                /* ============= LAYAR RECAPTCHA ============= */
        #captchaScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8F5EB;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
            padding: 20px;
        }

        #captchaScreen.hidden {
            display: none !important;
        }

        .g-recaptcha {
            display: flex;
            justify-content: center;
        }

                        /* ============= REPLY CHAT ============= */
        .msg-wrapper {
            position: relative;
        }

        /* Kotak pesan yang akan dibalas */
        .reply-preview {
            background: rgba(59, 130, 212, 0.1);
            border-left: 4px solid var(--biru);
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 13px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reply-preview .nama-pengirim {
            font-weight: bold;
            color: var(--biru);
            margin-right: 6px;
        }

        .reply-preview .teks-pesan {
            color: #444;
            opacity: 0.8;
        }

        .reply-preview .tutup-reply {
            cursor: pointer;
            font-size: 16px;
            color: #888;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .reply-preview .tutup-reply:hover {
            color: #000;
        }

        /* Tampilan pesan yang dibalas di dalam chat */
        .dibalas-dalam-pesan {
            background: rgba(0,0,0,0.05);
            border-left: 3px solid var(--biru);
            padding: 4px 8px;
            margin-bottom: 4px;
            font-size: 12px;
            opacity: 0.8;
            border-radius: 3px;
        }

        /* Tampilan pesan yang dibalas di dalam chat */
        .dibalas-dalam-pesan {
            background: rgba(59, 130, 212, 0.1);
            border-left: 4px solid #3B82D4;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 13px;
            border-radius: 4px;
            color: #333;
        }
        .dibalas-dalam-pesan strong {
            color: #3B82D4;
        }

        
    </style>
</head>
<body>

    <!-- LAYAR VERIFIKASI RECAPTCHA -->
    <div id="captchaScreen">
        <div class="name-card">
            <h2>🔐 VERIFIKASI</h2>
            <p style="margin-bottom:20px">Centang kotak di bawah untuk membuktikan bahwa kamu bukan robot</p>
            
            <!-- Kotak reCAPTCHA Google -->
            <div class="g-recaptcha" 
                 data-sitekey="6LfiY_YtAAAAAO_ZVdT456vFsOxyCBjOWlQyG2TV"
                 data-callback="berhasilVerifikasi"
                 data-expired-callback="ulangiVerifikasi">
            </div>
            
            <p id="statusVerifikasi" style="margin-top:15px; font-size:13px; color:#666">Belum diverifikasi</p>
        </div>
    </div>
    
    <!-- LAYAR MASUK NAMA -->
    <div id="nameScreen">
        <div class="name-card">
            <h2>👋 SELAMAT DATANG!</h2>
            <p>Masukkan nama untuk memulai<br>Global Chat</p>
            <input type="text" id="namaInput" placeholder="Masukkan nama..." maxlength="20" autocomplete="off">
            <button class="btn-yellow" onclick="simpanNama()">MASUK →</button>
        </div>
    </div>

    <!-- HALAMAN CHAT -->
    <div id="chatPage">
        <div class="header">
            <div class="header-top">
                <span class="header-title">🌐 GLOBAL CHAT</span>
                <button class="refresh-btn" onclick="refreshChat()">↻</button>
            </div>
            <div class="status-row">
                <span id="serverStatus" class="status-offline">● OFFLINE</span>
                <span>💬 CHAT TOTAL: <span id="totalChat">0</span></span>
                <span>👤 USER ONLINE: <span id="totalOnline">0</span></span>
                <span>🗓️ <span id="tanggalHari"></span></span>
              
            </div>
        </div>

        <div class="chat-container">
            <div id="chatBox"></div>
        </div>

             <!-- KOTAK PREVIEW PESAN YANG DIBALAS -->
<div id="replyPreviewBox" class="reply-preview" style="display:none; margin:0 16px; border-bottom:2px solid #000;">
    <span>
        <span class="nama-pengirim" id="replyNama"></span>
        <span class="teks-pesan" id="replyTeks"></span>
    </span>
    <span class="tutup-reply" onclick="batalkanBalas()">&times;</span>
</div>

<!-- KOLOM KETIK PESAN KAMU TETAP SAMA -->
<div class="input-bar">
    <input type="text" id="pesanInput" placeholder="Ketik pesan..." autocomplete="off"
           onkeypress="if(event.key==='Enter')kirimPesan()">
    <button class="send-btn" id="kirimBtn" onclick="kirimPesan()">➤</button>
</div>

    <!-- ALERT KUSTOM -->
    <div id="alertOverlay" onclick="tutupAlertDariLuar(event)">
        <div class="alert-card">
            <h3 id="alertJudul">Peringatan</h3>
            <p id="alertTeks"></p>
            <button class="btn-yellow" onclick="tutupAlert()">OK</button>
        </div>
    </div>
    <script>
                // ==============================================
        // 🔐 VERIFIKASI RECAPTCHA
        // ==============================================
        let pesanYangDibalas = null;

function batalkanBalas() {
    pesanYangDibalas = null;
    document.getElementById('replyPreviewBox').style.display = 'none';
}
        
        let sudahVerifikasi = false;

        function berhasilVerifikasi() {
            sudahVerifikasi = true;
            document.getElementById('statusVerifikasi').textContent = '✅ Terverifikasi!';
            document.getElementById('statusVerifikasi').style.color = '#22C55E';
            
            setTimeout(() => {
                document.getElementById('captchaScreen').classList.add('hidden');
            }, 600);
        }

        function ulangiVerifikasi() {
            sudahVerifikasi = false;
            document.getElementById('statusVerifikasi').textContent = '⚠️ Silakan centang ulang';
            document.getElementById('statusVerifikasi').style.color = '#EF4444';
        }

        // Sebelum simpan nama, pastikan sudah verifikasi
        async function simpanNama() {
            if (!sudahVerifikasi) {
                tampilkanAlert('Silakan verifikasi terlebih dahulu!');
                return;
            }
            
            const input = document.getElementById('namaInput');
            const nama = input.value.trim();
            
            if (nama.length < 3) {
                tampilkanAlert('Nama minimal 3 huruf!');
                return;
            }
            
            namaPengguna = nama;
            localStorage.setItem('gc_nama', namaPengguna);
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('chatPage').classList.add('show');
            masukKeChat();
                }
        
        // ==============================================
        // ⚙️ KONFIGURASI — GANTI DENGAN MILIKMU
        // ==============================================
        const SUPABASE_URL = 'https://izsrzxlnkcjzzvxetctd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6c3J6eGxua2Nqenp2eGV0Y3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjk0ODUsImV4cCI6MjEwNzk0NTQ4NX0.YAYFkVKNOr0e6-ZxoU4uPidKGXk7vKU_xeXpfOvkrZA';

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

        let namaPengguna = localStorage.getItem('gc_nama');
        let userId = localStorage.getItem('gc_user_id');
        let isSending = false;
        let pesanTerakhirId = null;
        let langgananPesan = null;
        let hariTerakhir = localStorage.getItem('gc_hari_terakhir');

        if (!userId) {
            userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem('gc_user_id', userId);
        }

        // ==============================================
        // 📅 TANGGAL & RESET HARIAN OTOMATIS
        // ==============================================
        function ambilTanggalHariIni() {
            const now = new Date();
            return now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function ambilTanggalSingkat() {
            return new Date().toDateString();
        }

        async function cekResetHarian() {
            const hariIni = ambilTanggalSingkat();
            if (hariTerakhir !== hariIni) {
                hariTerakhir = hariIni;
                localStorage.setItem('gc_hari_terakhir', hariTerakhir);
                await hapusSemuaPesan();
            }
        }

        async function hapusSemuaPesan() {
            try {
                await sb.from('pesan').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                const chatBox = document.getElementById('chatBox');
                if (chatBox) chatBox.innerHTML = '';
                tambahPesanSistem('📭 Chat telah direset untuk hari baru!');
            } catch (err) {
                console.error('Error reset:', err);
            }
        }

        function tampilkanTanggal() {
            const el = document.getElementById('tanggalHari');
            if (el) el.textContent = ambilTanggalHariIni();
        }

        // ==============================================
        // 🪟 ALERT KUSTOM
        // ==============================================
        function tampilkanAlert(teks, judul = 'Peringatan') {
            document.getElementById('alertJudul').textContent = judul;
            document.getElementById('alertTeks').textContent = teks;
            document.getElementById('alertOverlay').classList.add('aktif');
        }
        function tutupAlert() {
            document.getElementById('alertOverlay').classList.remove('aktif');
        }
        function tutupAlertDariLuar(event) {
            if (event.target.id === 'alertOverlay') tutupAlert();
        }

        // ==============================================
        // 🚀 INISIALISASI
        // ==============================================
                document.addEventListener('DOMContentLoaded', () => {
            tampilkanTanggal();
            cekResetHarian();
            
            // Cek apakah sudah pernah verifikasi + punya nama
            if (namaPengguna && namaPengguna.length >= 3) {
                document.getElementById('captchaScreen').classList.add('hidden');
                document.getElementById('nameScreen').classList.add('hidden');
                document.getElementById('chatPage').classList.add('show');
                masukKeChat();
            } else if (namaPengguna && namaPengguna.length < 3) {
                // Punya nama tapi belum lengkap → lanjut ke nama
                document.getElementById('captchaScreen').classList.add('hidden');
            }
            // Kalau belum verifikasi → tetap di layar captcha
        });


        // ==============================================
        // 👤 MASUK NAMA — TIDAK BISA GANTI
        // ==============================================
        async function simpanNama() {
            const input = document.getElementById('namaInput');
            const nama = input.value.trim();
            
            if (nama.length < 3) {
                tampilkanAlert('Nama minimal 3 huruf!');
                return;
            }
            
            namaPengguna = nama;
            localStorage.setItem('gc_nama', namaPengguna);
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('chatPage').classList.add('show');
            masukKeChat();
        }

        async function masukKeChat() {
            await perbaruiStatusUser('online');
            await muatPesanLama();
            mulaiDengarkanPesan();
            await hitungUserOnline();
            
            tambahPesanSistem(`🚀 Welcome ${namaPengguna}, To Global Chat.`);
            
            document.getElementById('serverStatus').className = 'status-online';
            document.getElementById('serverStatus').textContent = '● ONLINE';
            
            // Auto refresh tiap 4 detik
            setInterval(async () => {
                await muatPesanLama();
                await hitungUserOnline();
                cekResetHarian();
            }, 4000);
            
            setInterval(hitungUserOnline, 10000);
        }

        function tambahPesanSistem(teks) {
            const chatBox = document.getElementById('chatBox');
            if (!chatBox) return;
            
            const adaSistem = chatBox.querySelector('.msg-system');
            const html = `
                <div class="msg-system" id="pesanSistemUtama">
                    <div class="sender">[ SISTEM ]</div>
                    <div>${escapeHtml(teks)}</div>
                </div>
            `;
            
            if (adaSistem) {
                adaSistem.outerHTML = html;
            } else {
                chatBox.insertAdjacentHTML('afterbegin', html);
            }
        }

        // ==============================================
        // 📡 STATUS USER ONLINE
        // ==============================================
        async function perbaruiStatusUser(status) {
            try {
                await sb.from('users').upsert({
                    id: userId, nama: namaPengguna, status: status,
                    last_seen: new Date().toISOString()
                });
            } catch (err) {
                console.error('Error status:', err);
            }
        }

        async function hitungUserOnline() {
            try {
                const { data, error } = await sb
                    .from('users')
                    .select('id, nama, status, last_seen');
                
                if (error || !data) return;
                
                const sekarang = new Date();
                const limaMenitLalu = new Date(sekarang.getTime() - 5 * 60 * 1000).toISOString();
                
                // Bersihkan user yang hilang
                for (const u of data) {
                    if (u.status === 'online' && u.last_seen && u.last_seen < limaMenitLalu) {
                        await sb.from('users').update({ status: 'offline' }).eq('id', u.id);
                    }
                }
                
                const { data: dataBaru } = await sb.from('users').select('status');
                const online = dataBaru.filter(u => u.status === 'online').length;
                document.getElementById('totalOnline').textContent = online;
            } catch (err) {
                console.error('Error hitung online:', err);
            }
        }

        // ==============================================
        // 💬 KIRIM PESAN
        // ==============================================
        async function kirimPesan() {
    if (isSending) return;
    
    const input = document.getElementById('pesanInput');
    const pesan = input.value.trim();
    
    if (!pesan) {
        tampilkanAlert('Tulis pesan dulu!');
        return;
    }
    
    isSending = true;
    document.getElementById('kirimBtn').disabled = true;
    
    const pesanBaru = {
        user_id: userId,
        nama: namaPengguna,
        pesan: pesan,
        waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        tanggal: new Date().toDateString(),
        balas_ke: pesanYangDibalas // ✅ Data pesan yang dibalas ikut dikirim
    };
    
    try {
        console.log('📤 Mengirim pesan...', pesanBaru);
        
        const { data, error } = await sb.from('pesan').insert([pesanBaru]);
        
        if (error) {
            console.error('❌ Error dari Supabase:', error);
            throw new Error(error.message || 'Gagal kirim pesan');
        }
        
        console.log('✅ Pesan terkirim!', data);
        input.value = '';
        batalkanBalas(); // Hapus preview reply setelah kirim
        
    } catch (err) {
        console.error('❌ Error:', err);
        tampilkanAlert('Gagal: ' + err.message);
    }
    
    isSending = false;
    document.getElementById('kirimBtn').disabled = false;
}


        // ==============================================
        // 🔄 REFRESH MANUAL
        // ==============================================
        async function refreshChat() {
            const btn = document.querySelector('.refresh-btn');
            btn.style.transform = 'rotate(360deg)';
            setTimeout(() => btn.style.transform = '', 300);
            await muatPesanLama();
            window.scrollTo(0, document.body.scrollHeight);
        }

                // ==============================================
        // ↩️ BALAS PESAN — KLIK 2 KALI CEPAT
        // ==============================================
        function mulaiBalasPesan(msgElement) {
            const nama = msgElement.getAttribute('data-nama');
            const pesan = msgElement.getAttribute('data-pesan');
            
            pesanYangDibalas = {
                nama: nama,
                pesan: pesan
            };
            
            // Tampilkan preview di atas kolom input
            document.getElementById('replyNama').textContent = nama + ':';
            document.getElementById('replyTeks').textContent = pesan + '...';
            document.getElementById('replyPreviewBox').style.display = 'flex';
            
            // Fokus ke kolom ketik
            document.getElementById('pesanInput').focus();
        }

        function batalkanBalas() {
            pesanYangDibalas = null;
            document.getElementById('replyPreviewBox').style.display = 'none';
        }
        


        
        // ==============================================
        // 📥 MUAT PESAN
        // ==============================================
        async function muatPesanLama() {
    try {
        const hariIni = new Date().toDateString();
        const { data, error } = await sb
            .from('pesan')
            .select('*')
            .eq('tanggal', hariIni)
            .order('created_at', { ascending: true });
        
        if (error) throw error;
        
        const chatBox = document.getElementById('chatBox');
        if (!chatBox) return;

        // ✅ Simpan posisi scroll sekarang
        const posisiScroll = chatBox.scrollTop;
        const tinggiBox = chatBox.scrollHeight;
        const diBawah = (posisiScroll + chatBox.clientHeight) >= tinggiBox - 50;

        // ✅ Hanya tambah pesan BARU, jangan hapus yang lama
        const pesanYangAda = new Set();
        chatBox.querySelectorAll('[data-msg-id]').forEach(el => {
            pesanYangAda.add(el.getAttribute('data-msg-id'));
        });

        data.forEach(pesan => {
            if (!pesanYangAda.has(pesan.id)) {
                tampilkanPesan(pesan);
            }
        });

        // ✅ Kalau user ada di paling bawah → tetap di bawah
        if (diBawah) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        // Kalau user sedang baca di atas → jangan pindahkan posisinya

        // Update total chat
        document.getElementById('totalChat').textContent = data.length;

    } catch (err) {
        console.error('Error muat pesan:', err);
    }
}

         function mulaiDengarkanPesan() {
             if (langgananPesan) langgananPesan.unsubscribe();
             
             langgananPesan = sb
                 .channel('chat-live')
                 .on(
                     'postgres_changes',
                     { event: 'INSERT', schema: 'public', table: 'pesan' },
                     (res) => {
                         tampilkanPesan(res.new);
                         muatPesanLama();
                     }
                 )
                 .subscribe();
         }
         function tampilkanPesan(pesan) {
    if (pesanTerakhirId === pesan.id) return;
    pesanTerakhirId = pesan.id;
    
    const chatBox = document.getElementById('chatBox');
    if (!chatBox) return;
    
    const ada = document.querySelector(`[data-msg-id="${pesan.id}"]`);
    if (ada) return;
    
    const tipe = pesan.user_id === userId ? 'own' : 'other';
    
    // ✅ Tampilan pesan yang dibalas
    let balasHtml = '';
    if (pesan.balas_ke) {
        // Kalau balas_ke berupa string JSON, ubah jadi objek dulu
        let balasData = pesan.balas_ke;
        if (typeof balasData === 'string') {
            try { balasData = JSON.parse(balasData); } catch(e) {}
        }
        
        balasHtml = `
            <div class="dibalas-dalam-pesan">
                ↩️ <strong>${escapeHtml(balasData.nama)}:</strong> ${escapeHtml(balasData.pesan)}
            </div>
        `;
    }
    
    chatBox.insertAdjacentHTML('beforeend', `
        <div class="msg-wrapper ${tipe}" data-msg-id="${pesan.id}"
             data-nama="${escapeHtml(pesan.nama)}"
             data-pesan="${escapeHtml(pesan.pesan).substring(0, 50)}"
             ondblclick="mulaiBalasPesan(this)">
            
            <div class="msg-header">
                <span>${escapeHtml(pesan.nama)}</span>
                <span>${pesan.waktu}</span>
            </div>
            
            <div class="msg-bubble">
                ${balasHtml}
                ${escapeHtml(pesan.pesan)}
            </div>
        </div>
    `);
    
    chatBox.scrollTop = chatBox.scrollHeight;
}

         function escapeHtml(t) {
             if (!t) return '';
             const div = document.createElement('div');
             div.textContent = t;
             return div.innerHTML;
         }
         // ==============================================
         // 🚪 KELUAR / TUTUP
         // ==============================================
         window.addEventListener('beforeunload', async () => {
             if (userId) {
                 await sb.from('users').update({ status: 'offline' }).eq('id', userId);
                 if (langgananPesan) langgananPesan.unsubscribe();
             }
         });
     </script>
